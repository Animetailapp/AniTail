name: Build iOS

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target to produce"
        type: choice
        default: simulator
        options:
          - simulator
          - ipa
          - both
  push:
    branches:
      - "**"
    paths:
      - "iosApp/**"
      - "shared/**"
      - "scripts/build_ios.sh"
      - "scripts/ios_version.sh"
      - ".github/workflows/build_ios.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "iosApp/**"
      - "shared/**"
      - "scripts/build_ios.sh"
      - "scripts/ios_version.sh"
      - ".github/workflows/build_ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build_ios:
    name: iOS App & Unsigned IPA
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'ipa' || inputs.target == 'both' }}
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      ANITAIL_IOS_ONLY: "true"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "4"
      ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: "in-process"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          cache-cleanup: on-success

      - name: Configure Gradle memory limits for macOS runner
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10 -Dsun.zip.disableMemoryMapping=true -Dsun.io.useCanonCaches=false
          org.gradle.caching=true
          org.gradle.parallel=true
          kotlin.native.jvmArgs=-Xmx8g -XX:+UseG1GC -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10
          EOF

      - name: Cache Kotlin Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/src/iosMain/cinterop/**') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate Compose resources and iOS build script
        run: |
          xcodebuild -version
          chmod +x gradlew scripts/build_ios.sh scripts/ios_version.sh
          python3 scripts/check_compose_resource_escapes.py
          bash -n scripts/build_ios.sh

      - name: Compile iOS release framework
        env:
          CONFIGURATION: Release
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-configuration-cache

      - name: Package unsigned IPA
        run: ./scripts/build_ios.sh --ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AniTail-iOS-IPA
          path: dist/AniTail.ipa
          if-no-files-found: error
          retention-days: 14

  build_ios_simulator:
    name: iOS Simulator App (Appetize.io)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'simulator' || inputs.target == 'both') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ANITAIL_IOS_ONLY: "true"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "2"
      ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: "in-process"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          architecture: aarch64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Configure Gradle memory limits for macOS runner
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10 -Dsun.zip.disableMemoryMapping=true -Dsun.io.useCanonCaches=false
          kotlin.native.jvmArgs=-Xmx8g -XX:+UseG1GC -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10
          EOF

      - name: Cache Kotlin Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/src/iosMain/cinterop/**') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate Compose resources and iOS build script
        run: |
          xcodebuild -version
          chmod +x gradlew scripts/build_ios.sh scripts/ios_version.sh
          python3 scripts/check_compose_resource_escapes.py
          bash -n scripts/build_ios.sh

      - name: Compile iOS simulator debug framework
        env:
          CONFIGURATION: Debug
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache

      - name: Package iOS Simulator app zip for Appetize.io
        run: |
          ./scripts/build_ios.sh --sim
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' dist/AniTail.app/Info.plist)" == "iphonesimulator" ]]
          (cd dist && rm -f AniTail-sim.zip && zip -qry AniTail-sim.zip AniTail.app)
          unzip -tq dist/AniTail-sim.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: AniTail-iOS-Simulator-Appetize
          path: dist/AniTail-sim.zip
          if-no-files-found: error
          retention-days: 14
